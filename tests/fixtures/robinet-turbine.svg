    <path d="M 70 300 L 70 120 Q 70 70 120 70 L 300 70 Q 340 70 340 110 L 340 130" class="tuyau-ext" />
    <path d="M 70 300 L 70 120 Q 70 70 120 70 L 300 70 Q 340 70 340 110 L 340 130" class="tuyau-int" />
    <path d="M 70 300 L 70 120 Q 70 70 120 70 L 300 70 Q 340 70 340 110 L 340 130" class="eau-flux" />
    <path d="M 340 138 L 340 220" class="eau-chute" />
    <g transform="translate(70 214)">
      <circle r="34" class="repere" />
      <g transform="scale(.27)">
    <title>Turbine</title>
    <circle r="96" class="turbine-carter" />
    <g class="turbine-rotor">
      <g class="turbine-aubes" fill="#F2F0EA" stroke="#55606b" stroke-width="2.5" stroke-linejoin="round"><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(0)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(45)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(90)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(135)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(180)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(225)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(270)" /><path d="M 4 -20 C 30 -36, 40 -62, 22 -88 L 8 -89 C 20 -64, 14 -40, -8 -21 Z" transform="rotate(315)" /></g>
      <circle r="22" fill="#F2F0EA" stroke="#55606b" stroke-width="3" />
      <circle r="6" fill="#55606b" />
