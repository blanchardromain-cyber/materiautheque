<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matériauthèque</title>
  <meta name="description" content="Choisir un matériau en le justifiant par un cahier des charges — Technologie, cycle 4.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2318222E'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23F2C230'/%3E%3C/svg%3E">
</head>
<body>
  <a class="evitement" href="#scene">Aller au contenu</a>
  <header class="entete">
    <div class="marque">
      <span class="marque-nom">Matériauthèque</span>
      <span class="marque-piece" id="piece"></span>
    </div>
    <nav aria-label="Étapes du parcours"><ol class="etapes" id="etapes"></ol></nav>
    <div class="outils-entete">
      <span class="niveau" id="niveau" hidden></span>
      <button type="button" class="bouton-discret" id="theme" aria-pressed="false">Thème sombre</button>
    </div>
  </header>
  <main id="scene" tabindex="-1">
    <p class="chargement">Chargement des matériaux…</p>
  </main>
  <dialog id="consequence" aria-labelledby="consequence-titre"></dialog>
  <script type="module" src="app/parcours.js"></script>

</html>
